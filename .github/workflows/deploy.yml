name: Deploy Docs to GitHub Pages

on:
  # Runs on pushes to the default branch
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # Any package can contribute docs/registry data (versions, examples),
      # so trigger on the whole packages/ tree instead of a per-package list.
      - "packages/**"
      - ".github/workflows/deploy.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do NOT cancel in-progress runs: production
# deployments should be allowed to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for `lastUpdated`

      - uses: pnpm/action-setup@v4
        # version omitted: action reads `packageManager` from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: apps/docs/.vitepress/cache
          # Source-only globs: generated wasm/worker and node_modules must not
          # participate in the cache key (slow, and flaky with symlinks).
          # Hash the whole packages/ tree (not just excel-exporter): any
          # package can contribute registry data to the docs site.
          key: ${{ runner.os }}-vitepress-${{ hashFiles('pnpm-lock.yaml', 'apps/docs/**/*.md', 'apps/docs/**/*.{ts,vue,css}', 'apps/docs/package.json', 'apps/docs/turbo.json', 'packages/**/package.json', 'packages/**/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gate before deploying: this workflow runs in parallel with CI
      # on pushes to main (cross-workflow `needs` is not possible), so without
      # these steps a commit that fails lint/typecheck/test would still go live
      # whenever it only breaks non-build checks. Re-running the same suite
      # here makes the deployment itself the gate.
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          RUN_PERF: "0"

      - name: Build with VitePress
        # turbo builds @marcusok/excel-exporter first (docs app depends on it),
        # then the docs app copies wasm/worker into public/assets and builds.
        run: pnpm exec turbo run build --filter=@marcusok/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
