name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        # version omitted: action reads `packageManager` from package.json
        # (pnpm@9.12.0), keeping CI in sync with local corepack.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD
      - name: Lint pushed commit messages (main)
        # This repo develops directly on main: the PR-only lint above never saw
        # direct pushes, so commit-message hygiene rested entirely on the local
        # husky hook (--no-verify bypasses it). Lint every commit the push adds.
        if: github.event_name == 'push'
        run: |
          FROM="${{ github.event.before }}"
          if git cat-file -e "$FROM" 2>/dev/null; then
            pnpm exec commitlint --from "$FROM" --to HEAD
          else
            # before-sha unavailable (force push / rewritten ref): lint the tip.
            pnpm exec commitlint --from HEAD~1 --to HEAD
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          RUN_PERF: "0"
      - run: pnpm build
